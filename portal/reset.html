<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Reset password · Stephen Amanor Sackey</title>
<script>
/* set the theme BEFORE first paint so there is no flash of the wrong colours */
(function(){ var t='light'; try{ t=localStorage.getItem('portal-theme')||'light'; }catch(e){}
  document.documentElement.setAttribute('data-theme',t); })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="icon" href="../images/logo.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#F7F5F1">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="S·A·S Studio">
<link rel="stylesheet" href="../assets/portal.css">
</head>
<body>
<div class="auth-wrap"><div class="auth">
  <p class="eyebrow">Password reset</p>
  <h1>Set a new password</h1>
  <p class="sub" id="s">Checking your link…</p>
  <form id="f" novalidate style="display:none">
    <div class="field"><label for="pw">New password</label>
      <input id="pw" type="password" autocomplete="new-password" required></div>
    <div class="field"><label for="pw2">Type it again</label>
      <input id="pw2" type="password" autocomplete="new-password" required></div>
    <button class="btn" id="go" type="submit">Save password</button>
    <p class="msg" id="m" role="status" aria-live="polite"></p>
  </form>
  <p class="foot"><a href="login.html">Back to sign in</a></p>
</div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../assets/portal.js"></script>
<script>

let ready = false;
sb.auth.onAuthStateChange((event) => {
  if(event === 'PASSWORD_RECOVERY' || event === 'SIGNED_IN'){
    ready = true;
    $('#s').textContent = 'Choose something you will remember.';
    $('#f').style.display = 'flex';
  }
});
setTimeout(()=>{ if(!ready) $('#s').textContent =
  'This link has expired or was already used. Request a new one from the sign-in page.'; }, 2500);

$('#f').addEventListener('submit', async e => {
  e.preventDefault();
  const m=$('#m'), a=$('#pw').value, b=$('#pw2').value;
  if(a.length<8) return say(m,'Use at least 8 characters.','err');
  if(a!==b)      return say(m,'Those two do not match.','err');
  const { error } = await sb.auth.updateUser({ password:a, data:{ must_change_password:false } });
  if(error) return say(m,error.message,'err');
  say(m,'Done. Signing you in.','ok');
  setTimeout(()=>location.replace('dashboard.html'), 700);
});

</script>
</body>
</html>
