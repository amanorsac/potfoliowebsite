<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Traffic · Studio admin</title>
<script>
/* set the theme BEFORE first paint so there is no flash of the wrong colours */
(function(){ var t='light'; try{ t=localStorage.getItem('portal-theme')||'light'; }catch(e){}
  document.documentElement.setAttribute('data-theme',t); })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="icon" href="../images/logo.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#F7F5F1">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="AMANORSAC">
<link rel="stylesheet" href="../assets/portal.css">
<style>
  /* ---------- the range switch ---------- */
  .range{display:flex;gap:6px;margin:0 0 20px}
  .range button{font-family:var(--body);font-size:13px;font-weight:500;cursor:pointer;
    color:var(--ink);background:var(--surface-2);border:1px solid var(--line);
    border-radius:999px;padding:8px 15px;transition:background .2s,border-color .2s}
  .range button.on{background:var(--accent);border-color:var(--accent);color:#fff}

  /* ---------- headline numbers ---------- */
  .figs{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:0 0 22px}
  .fig{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 20px}
  .fig .k{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--muted);margin:0 0 8px}
  .fig .v{font-size:30px;font-weight:600;line-height:1;margin:0}
  .fig .d{font-size:12.5px;margin:7px 0 0;color:var(--muted)}
  .fig .d.up{color:#2E8B6E}
  .fig .d.down{color:#B4552F}

  /* ---------- the daily bars ---------- */
  .chart{display:flex;align-items:flex-end;gap:2px;height:132px;padding:0 0 2px;
    border-bottom:1px solid var(--line);margin:0 0 8px}
  .chart i{flex:1;min-width:2px;background:var(--accent);border-radius:2px 2px 0 0;
    opacity:.85;min-height:2px;position:relative}
  .chart i:hover{opacity:1}
  .chart i span{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);
    white-space:nowrap;font-family:var(--mono);font-size:10px;background:var(--ink);
    color:var(--surface);padding:4px 7px;border-radius:5px;margin-bottom:6px;
    opacity:0;pointer-events:none;transition:opacity .15s}
  .chart i:hover span{opacity:1}
  .chart-x{display:flex;justify-content:space-between;font-family:var(--mono);
    font-size:10px;color:var(--muted);margin:0 0 4px}

  /* ---------- lists ---------- */
  .cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
  .rows{list-style:none;margin:0;padding:0}
  .rows li{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:baseline;
    padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
  .rows li:last-child{border-bottom:0}
  .rows .lab{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .rows .lab small{display:block;color:var(--muted);font-size:12px}
  .rows .num{font-family:var(--mono);font-size:12.5px;color:var(--muted)}
  .empty{color:var(--muted);font-size:14px;margin:0;padding:8px 0}
</style>
</head>
<body>
<header class="top" id="topbar"></header>
<main>
  <div class="head">
    <p class="eyebrow">Studio admin</p>
    <h1>Traffic</h1>
    <p class="sub">Who is on the site, what they are reading, and where they came from. No cookies, so nobody gets a consent banner and nobody gets followed around.</p>
  </div>

  <div class="range" id="range">
    <button type="button" data-d="7">7 days</button>
    <button type="button" data-d="30" class="on">30 days</button>
    <button type="button" data-d="90">90 days</button>
  </div>

  <p class="msg" id="m" role="status" aria-live="polite"></p>

  <div class="figs" id="figs"></div>

  <div class="card">
    <div class="card-head"><h2>By day</h2></div>
    <div class="chart" id="chart"></div>
    <div class="chart-x"><span id="x0"></span><span id="x1"></span></div>
  </div>

  <div class="cols">
    <div class="card">
      <div class="card-head"><h2>Most read</h2></div>
      <ul class="rows" id="pages"></ul>
    </div>
    <div class="card">
      <div class="card-head"><h2>Where they came from</h2></div>
      <ul class="rows" id="sources"></ul>
    </div>
    <div class="card">
      <div class="card-head"><h2>On what</h2></div>
      <ul class="rows" id="devices"></ul>
    </div>
    <div class="card">
      <div class="card-head"><h2>From where</h2></div>
      <ul class="rows" id="countries"></ul>
    </div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../assets/portal.js"></script>
<script>
(async function(){
  const me = await requireAdmin(); if(!me) return;   // bounces anyone who is not the studio
  await mountChrome('admin-traffic');

  const m = $('#m');
  let days = 30;

  const esc = t => { const d=document.createElement('div'); d.textContent = t==null?'':t; return d.innerHTML; };
  const num = n => Number(n||0).toLocaleString();

  function delta(now, before){
    if(!before) return '';
    const pct = Math.round(((now - before) / before) * 100);
    if(!isFinite(pct) || pct === 0) return '<span class="d">no change on the period before</span>';
    const up = pct > 0;
    return '<span class="d '+(up?'up':'down')+'">'+(up?'▲':'▼')+' '+Math.abs(pct)+'% on the period before</span>';
  }

  function list(el, rows, fmt){
    if(!rows.length){ el.innerHTML = '<li class="empty">Nothing yet.</li>'; return; }
    el.innerHTML = rows.map(fmt).join('');
  }

  async function draw(){
    say(m, 'Loading…');

    const [sum, daily, top, brk] = await Promise.all([
      sb.rpc('analytics_summary',   { p_days: days }),
      sb.rpc('analytics_daily',     { p_days: days }),
      sb.rpc('analytics_top_pages', { p_days: days, p_limit: 12 }),
      sb.rpc('analytics_breakdown', { p_days: days })
    ]);

    const err = [sum, daily, top, brk].find(r => r.error);
    if(err){
      // The most likely cause by far is that the SQL has not been run yet.
      say(m, /function|does not exist|schema cache/i.test(err.error.message)
        ? 'Analytics is not set up in the database yet. Run supabase-analytics.sql in the Supabase SQL editor, then reload this page.'
        : err.error.message, 'err');
      return;
    }
    say(m, '');

    /* ---- headline ---- */
    const s = (sum.data && sum.data[0]) || {views:0, visits:0, prev_views:0, prev_visits:0};
    $('#figs').innerHTML =
      '<div class="fig"><p class="k">Visits</p><p class="v">'+num(s.visits)+'</p>'+delta(s.visits, s.prev_visits)+'</div>'+
      '<div class="fig"><p class="k">Page views</p><p class="v">'+num(s.views)+'</p>'+delta(s.views, s.prev_views)+'</div>'+
      '<div class="fig"><p class="k">Pages per visit</p><p class="v">'+
        (s.visits ? (s.views/s.visits).toFixed(1) : '0')+'</p></div>';

    /* ---- the daily bars ---- */
    const d = daily.data || [];
    const peak = Math.max(1, ...d.map(r => Number(r.views)));
    $('#chart').innerHTML = d.length
      ? d.map(r => '<i style="height:'+Math.max(2, Math.round(Number(r.views)/peak*128))+'px">'+
          '<span>'+esc(r.day)+' · '+num(r.views)+' views · '+num(r.visits)+' visits</span></i>').join('')
      : '';
    $('#x0').textContent = d.length ? d[0].day : '';
    $('#x1').textContent = d.length ? d[d.length-1].day : '';

    /* ---- most read ---- */
    list($('#pages'), top.data || [], r =>
      '<li><span class="lab">'+esc(r.path)+
        (r.title ? '<small>'+esc(r.title)+'</small>' : '')+
      '</span><span class="num">'+num(r.views)+'</span></li>');

    /* ---- the three breakdowns come back in one call ---- */
    const of = kind => (brk.data || []).filter(r => r.kind === kind).slice(0, 10);
    const simple = r => '<li><span class="lab">'+esc(r.label)+'</span>'+
                        '<span class="num">'+num(r.visits)+'</span></li>';
    list($('#sources'),   of('source'),  simple);
    list($('#devices'),   of('device'),  simple);
    list($('#countries'), of('country'), simple);
  }

  $$('#range button').forEach(b => b.addEventListener('click', () => {
    $$('#range button').forEach(x => x.classList.remove('on'));
    b.classList.add('on');
    days = Number(b.getAttribute('data-d'));
    draw();
  }));

  draw();
})();
</script>
</body>
</html>
