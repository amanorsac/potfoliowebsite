<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Account · Stephen Amanor Sackey</title>
<script>
/* set the theme BEFORE first paint so there is no flash of the wrong colours */
(function(){ var t='light'; try{ t=localStorage.getItem('portal-theme')||'light'; }catch(e){}
  document.documentElement.setAttribute('data-theme',t); })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="icon" href="../images/logo.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#F7F5F1">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="S·A·S Studio">
<link rel="stylesheet" href="../assets/portal.css">
</head>
<body>
<header class="top" id="topbar"></header>
<main>
  <div class="head">
    <p class="eyebrow">Account</p>
    <h1>Your details</h1>
  </div>
  <div class="grid2">
    <div class="card">
      <h2>Profile</h2>
      <div class="avatar-edit">
        <div class="avatar lg" id="av-shot"></div>
        <div>
          <label class="btn ghost" for="av-file">Choose a picture</label>
          <input id="av-file" type="file" accept="image/*" hidden>
          <button class="linkbtn" id="av-clear" type="button" hidden>Remove</button>
          <p class="hint" id="av-msg">JPG or PNG, under 3 MB.</p>
        </div>
      </div>
      <form id="pf">
        <div class="field"><label for="name">Name</label><input id="name"></div>
        <div class="field"><label for="co">Company or artist name</label><input id="co"></div>
        <div class="field"><label for="em">Email</label><input id="em" disabled></div>
        <button class="btn" type="submit">Save</button>
        <p class="msg" id="pm" role="status" aria-live="polite"></p>
      </form>
    </div>
    <div class="card">
      <h2>Password</h2>
      <form id="pwf">
        <div class="field"><label for="pw">New password</label>
          <input id="pw" type="password" autocomplete="new-password"></div>
        <div class="field"><label for="pw2">Type it again</label>
          <input id="pw2" type="password" autocomplete="new-password"></div>
        <button class="btn" type="submit">Change password</button>
        <p class="msg" id="wm" role="status" aria-live="polite"></p>
      </form>
      <h2 style="margin-top:30px">Appearance</h2>
      <button class="btn ghost" onclick="Theme.toggle()">Switch light / dark</button>
    </div>
  </div>
</main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../assets/portal.js"></script>
<script>

(async () => {
  const s = await requireSession(); if(!s) return;
  const me = await mountChrome('account');
  $('#name').value = me.full_name || ''; $('#co').value = me.company || ''; $('#em').value = me.email || '';

  /* ---------- profile picture ----------
     The bucket is private, so the page holds a path and asks for a
     signed link when it needs to show one. Nothing is reachable by
     guessing a URL. */
  async function paintAvatar(path){
    const el = $('#av-shot');
    const url = await avatarUrl(path);
    el.innerHTML = url
      ? '<img src="'+esc(url)+'" alt="">'
      : initialsOf(me.full_name || me.email);
    $('#av-clear').hidden = !path;
  }
  await paintAvatar(me.avatar_path);

  $('#av-file').addEventListener('change', async e => {
    const file = e.target.files && e.target.files[0];
    if(!file) return;
    const m = $('#av-msg');
    if(file.size > 3 * 1024 * 1024) return say(m, 'That one is over 3 MB.', 'err');

    say(m, 'Uploading…');
    // Foldered by user id — that first segment is what the storage policy
    // checks, so a path outside your own folder is refused by the database
    // rather than trusted from the browser.
    const ext  = (file.name.split('.').pop() || 'jpg').toLowerCase().replace(/[^a-z0-9]/g,'');
    const path = me.id + '/avatar.' + ext;

    const { error: upErr } = await sb.storage.from('avatars')
      .upload(path, file, { upsert: true, contentType: file.type });
    if(upErr) return say(m, upErr.message, 'err');

    const { error } = await sb.from('profiles').update({ avatar_path: path }).eq('id', me.id);
    if(error) return say(m, error.message, 'err');

    me.avatar_path = path;
    await paintAvatar(path);
    say(m, 'Saved.', 'ok');
  });

  $('#av-clear').addEventListener('click', async () => {
    const m = $('#av-msg');
    const { error } = await sb.from('profiles').update({ avatar_path: null }).eq('id', me.id);
    if(error) return say(m, error.message, 'err');
    me.avatar_path = null;
    await paintAvatar(null);
    say(m, 'Removed.', 'ok');
  });

  $('#pf').addEventListener('submit', async e => {
    e.preventDefault();
    const m=$('#pm');
    const { error } = await sb.from('profiles')
      .update({ full_name:$('#name').value.trim(), company:$('#co').value.trim() }).eq('id', me.id);
    say(m, error ? error.message : 'Saved.', error ? 'err':'ok');
  });

  $('#pwf').addEventListener('submit', async e => {
    e.preventDefault();
    const m=$('#wm'), a=$('#pw').value, b=$('#pw2').value;
    if(a.length<8) return say(m,'Use at least 8 characters.','err');
    if(a!==b)      return say(m,'Those two do not match.','err');
    const { error } = await sb.auth.updateUser({ password:a });
    say(m, error ? error.message : 'Password changed.', error ? 'err':'ok');
    if(!error){ $('#pw').value=''; $('#pw2').value=''; }
  });
})();

</script>
</body>
</html>
